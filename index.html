<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Agent Village — Phase 2</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0a;color:#e8e8e8;
    font-family:ui-monospace,Menlo,monospace;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent}
  canvas{display:block;touch-action:none}
  /* ---- HUD: transparente, il mondo è protagonista ---- */
  #hud{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;
    padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));
    background:linear-gradient(#0a0a0ae6,#0a0a0a00);font-size:13px;z-index:6;flex-wrap:wrap;
    pointer-events:none}
  #hud>*{pointer-events:auto}
  .gold{color:#d4a017;font-weight:700;letter-spacing:.5px}
  #mode{font-size:10px;padding:2px 6px;border:1px solid #333;border-radius:10px;color:#888;
    white-space:nowrap}
  #mode.replay{border-color:#d4a017;color:#d4a017}
  button{background:#141414d9;color:#e8e8e8;border:1px solid #333;border-radius:8px;
    padding:6px 10px;font:inherit;font-size:12px;cursor:pointer;min-height:30px}
  button.on{border-color:#d4a017;color:#d4a017}
  /* ---- card agenti: compatte, scroll orizzontale ---- */
  #cards{position:fixed;top:42px;left:0;right:0;display:flex;gap:6px;padding:4px 8px;
    overflow-x:auto;z-index:5;font-size:11px;scrollbar-width:none}
  #cards::-webkit-scrollbar{display:none}
  .card{min-width:150px;flex:1 1 150px;max-width:230px;background:#0d0d0de0;border:1px solid #262626;
    border-radius:10px;padding:6px 8px;backdrop-filter:blur(6px)}
  .card.dead{opacity:.45;border-color:#5a1a1a}
  .card h4{margin:0 0 2px;font-size:12px;display:flex;justify-content:space-between}
  .doing{color:#5ac8fa;min-height:13px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .goal{color:#777;font-size:10px;min-height:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .inv{font-size:10px;margin:3px 0 2px;color:#bbb}
  .row{display:flex;justify-content:space-between;font-size:9px;margin:2px 0 1px;color:#888}
  .bar{height:5px;background:#1e1e1e;border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;transition:width .3s}
  /* ---- registro: richiudibile ---- */
  #log{position:fixed;left:0;right:0;bottom:0;height:30vh;overflow-y:auto;
    background:#0a0a0af0;border-top:1px solid #262626;padding:6px 10px;padding-bottom:max(6px,env(safe-area-inset-bottom));
    font-size:11px;z-index:5;transition:height .2s}
  #log.collapsed{height:30px;padding-top:6px;overflow:hidden}
  #log div{margin:2px 0;white-space:pre-wrap}
  .k-decision{color:#d4a017}.k-event{color:#7ee787}.k-fail{color:#ff6b6b}
  .k-death{color:#ff4444;font-weight:bold}.k-local{color:#888}.k-h{color:#555;margin-top:6px!important}
  .t{color:#555}
  #bLog{position:fixed;right:8px;bottom:calc(30vh + 8px);z-index:7;min-height:34px;min-width:38px;
    background:#141414e6}
  #log.collapsed~#bLog{bottom:38px}
  @media (max-width:640px){
    /* HUD in UNA riga sola: niente wrap che copre le card */
    #hud{gap:5px;font-size:11px;flex-wrap:nowrap;overflow:hidden;white-space:nowrap;padding:6px 8px}
    .gold{font-size:11px;letter-spacing:0}
    #mode{display:none}
    #clock{font-size:11px}
    button{padding:5px 7px;font-size:11px;min-height:28px;min-width:30px}
    #cards{top:38px;gap:4px;padding:4px 6px}
    .card{min-width:0;flex:1 1 0;padding:5px 6px}
    .inv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    /* log collassato: solo l'ultima riga, mai tagliata */
    #log.collapsed{height:34px;padding-bottom:4px}
    #log.collapsed div{display:none}
    #log.collapsed div:last-child{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #bLog{bottom:42px;min-height:30px;min-width:34px}
  }
</style>
</head>
<body>
<div id="hud">
  <span class="gold">🏛 AGENT VILLAGE</span>
  <span>🕒 <b id="clock">Day 1 · 00:00</b></span>
  <span id="mode">loading…</span>
  <button id="bPlay" class="on">⏸</button>
  <button class="spd on" data-s="1">1×</button>
  <button class="spd" data-s="2">2×</button>
  <button class="spd" data-s="4">4×</button>
  <button id="bNew" style="display:none">＋ NEW SIM</button>
</div>
<div id="cards"></div>
<div id="log"></div>
<button id="bLog" title="log">📜</button>

<script id="sim">
/* Pure engine: virtual clock, 3 villagers, resources, plans, validated actions.
   No DOM/THREE. Browser: window.SIM. Node: module.exports. */
(function () {
  var LOCS = { camp: [8, 8], farm: [3, 3], well: [4, 12], forest: [12, 4] };
  var NODE_OF = { food: 'farm', water: 'well', wood: 'forest' };
  var ACTIONS = [
    'go(place): 1h travel to camp|farm|well|forest',
    'gather_food|gather_water|gather_wood: 1h at that node, +2 units (needs stock)',
    'eat: consume 1 food, hunger -50',
    'drink: consume 1 water, health +15',
    'rest: 1h energy +20, or +45 if you burn 1 wood (campfire)',
    'give(who,what,n): transfer n of food|water|wood to a villager at your location',
    'take(who,what,n): take n from a villager at your location (they WILL notice)',
    'say(who,text): speak to a villager at your location (enters their memory)',
    'wait: 1h doing nothing',
    'till: 6h at farm|well|forest — upgrades that node (production +1 per 4h). Costs one day of the OTHER two resources',
    'create: 24h at farm|well|forest — adds a new tile there (more production forever). Costs one WEEK of the OTHER two resources'
  ];
  var NAMES = ['Ada', 'Bram', 'Cia', 'Dario'];

  function createState() {
    return {
      h: 0,
      nodes: { food: { stock: 40, max: 60, tiles: 1, level: 1 }, water: { stock: 26, max: 36, tiles: 1, level: 1 }, wood: { stock: 24, max: 40, tiles: 1, level: 1 } },
      agents: NAMES.map(function (n, i) {
        return {
          id: i, name: n, loc: 'camp', inv: { food: 2, water: 1, wood: 0 },
          hunger: 30, energy: 90, health: 100, alive: true,
          goal: '', thought: '', plan: [], pi: 0, status: 'idle',
          needsDecision: true, lastCallH: -99, memory: []
        };
      }),
      log: []
    };
  }

  function out(s, kind, agent, text) {
    s.log.push({ h: s.h, kind: kind, agent: agent || '', text: text });
  }
  function remember(s, a, text) {
    a.memory.push({ h: s.h, text: text });
    if (a.memory.length > 40) a.memory.shift();
  }
  // failed actions live in their own deduped list so they never flood the social memory
  function rememberFail(a, action, reason) {
    var k = action + ' (' + reason + ')';
    var list = a.pastFails || (a.pastFails = []);
    if (list.indexOf(k) < 0) { list.push(k); if (list.length > 8) list.shift(); }
  }
  function dur(st) {
    if (st.action === 'till') return 6;
    if (st.action === 'create') return 24;
    var multi = /^(go|gather_|rest$|wait)/.test(st.action) || st.action === 'rest' || st.action === 'wait';
    return multi ? Math.min(8, Math.max(1, st.hours || 1)) : 1;
  }
  function desc(st) {
    var s = st.action;
    if (st.action === 'go') s += '→' + st.place;
    if (/^gather_/.test(st.action)) s += (st.hours > 1 ? '×' + st.hours : '');
    if (st.action === 'rest' && st.hours > 1) s += '×' + st.hours;
    if (st.action === 'give' || st.action === 'take') s += '(' + st.who + ': ' + (st.n || 1) + ' ' + st.what + ')';
    if (st.action === 'say') s += '(' + st.who + ')';
    return s;
  }

  // Engine validation: the ONLY place actions take effect. Returns {ok, text}.
  function applyAction(s, a, st) {
    var t, r;
    switch (st.action) {
      case 'go':
        if (!LOCS[st.place]) return { ok: false, text: 'unknown place ' + st.place };
        a.loc = st.place;
        return { ok: true, text: 'arrived at ' + st.place };
      case 'gather_food': case 'gather_water': case 'gather_wood':
        r = st.action.slice(7);
        if (a.loc !== NODE_OF[r]) return { ok: false, text: 'not at the ' + NODE_OF[r] };
        if (s.nodes[r].stock < 1) return { ok: false, text: NODE_OF[r] + ' exhausted' };
        t = Math.min(3, s.nodes[r].stock);
        s.nodes[r].stock -= t; a.inv[r] += t;
        return { ok: true, text: '+' + t + ' ' + r };
      case 'till': case 'create': {
        // ponytail: baseline costs (day=6, week=42 of the other two resources from node stock).
        // upgrade path: scale cost with current production if baseline inflates.
        var res = { farm: 'food', well: 'water', forest: 'wood' }[a.loc];
        if (!res) return { ok: false, text: 'nothing to work here' };
        var others = ['food', 'water', 'wood'].filter(function (x) { return x !== res; });
        var mult = st.action === 'create' ? 42 : 6;
        for (var oi = 0; oi < others.length; oi++) {
          if (s.nodes[others[oi]].stock < mult)
            return { ok: false, text: 'needs ' + mult + ' ' + others[oi] + ' in the node to sacrifice' };
        }
        // validate every hour (fail fast if stock drops mid-work), pay+apply ONLY on the final hour
        if (st._left !== 1) return { ok: true, text: 'working the ' + a.loc };
        for (oi = 0; oi < others.length; oi++) s.nodes[others[oi]].stock -= mult;
        var nd = s.nodes[res];
        if (st.action === 'till') nd.level++; else nd.tiles++;
        nd.max = 24 + nd.tiles * nd.level * 12;
        return { ok: true, text: a.loc + ' now ' + nd.tiles + ' tiles lv' + nd.level };
      }
      case 'eat':
        if (a.inv.food < 1) return { ok: false, text: 'no food' };
        a.inv.food--; a.hunger = Math.max(0, a.hunger - 70);
        return { ok: true, text: 'hunger -50' };
      case 'drink':
        if (a.inv.water < 1) return { ok: false, text: 'no water' };
        a.inv.water--; a.health = Math.min(100, a.health + 15);
        return { ok: true, text: 'health +15' };
      case 'rest':
        if (a.inv.wood > 0) { a.inv.wood--; a.energy = Math.min(100, a.energy + 45); return { ok: true, text: 'campfire: energy +45' }; }
        a.energy = Math.min(100, a.energy + 20);
        return { ok: true, text: 'energy +20' };
      case 'wait':
        return { ok: true, text: 'waits' };
      case 'give': case 'take': case 'say':
        t = byName(s, st.who);
        if (t === a) return { ok: false, text: 'cannot interact with yourself' };
        if (!t || !t.alive) return { ok: false, text: (st.who || '?') + ' not available' };
        if (st.action === 'say') {
          if (t.loc !== a.loc) return { ok: false, text: st.who + ' is elsewhere' };
          remember(s, t, a.name + ' said: "' + String(st.text || '').slice(0, 120) + '"');
          t.needsDecision = true;
          out(s, 'event', a.name, '💬 ' + a.name + '→' + st.who + ': ' + String(st.text || '').slice(0, 80));
          return { ok: true, text: 'said to ' + st.who };
        }
        if (t.loc !== a.loc) return { ok: false, text: st.who + ' is elsewhere' };
        if (!st.what || !(st.n > 0)) return { ok: false, text: 'bad give/take args' };
        if (st.action === 'give') {
          if (a.inv[st.what] < st.n) return { ok: false, text: 'you lack ' + st.what };
          a.inv[st.what] -= st.n; t.inv[st.what] += st.n;
          remember(s, t, a.name + ' gave you ' + st.n + ' ' + st.what);
          t.needsDecision = true;
          out(s, 'event', a.name, '🎁 ' + a.name + ' → ' + st.n + ' ' + st.what + ' → ' + st.who);
          return { ok: true, text: 'gave ' + st.n + ' ' + st.what + ' to ' + st.who };
        }
        if (t.inv[st.what] < st.n) return { ok: false, text: st.who + ' lacks ' + st.what };
        t.inv[st.what] -= st.n; a.inv[st.what] += st.n;
        remember(s, t, a.name + ' TOOK ' + st.n + ' ' + st.what + ' from you!');
        t.needsDecision = true;
        out(s, 'event', a.name, '⚔ ' + a.name + ' took ' + st.n + ' ' + st.what + ' from ' + st.who);
        return { ok: true, text: 'took ' + st.n + ' ' + st.what + ' from ' + st.who };
      default:
        return { ok: false, text: 'unknown action ' + st.action };
    }
  }

  function byName(s, n) {
    for (var i = 0; i < s.agents.length; i++) if (s.agents[i].name === n) return s.agents[i];
    return null;
  }

  // One virtual hour. Vitals + plan execution + death + interrupts.
  function tick(s) {
    s.h++;
    if (s.h % 4 === 0) {
      for (var r in s.nodes) {
        var nd = s.nodes[r];
        var regen = nd.tiles * nd.level * (r === 'water' ? 1 : 2);  // cibo+legna doppio (4 bocche mangiano 24/giorno, bruciano ~60 legna/sett); acqua basta così
        if (nd.stock < nd.max) nd.stock = Math.min(nd.max, nd.stock + regen);
      }
    }
    for (var i = 0; i < s.agents.length; i++) {
      var a = s.agents[i];
      if (!a.alive) continue;
      a.hunger = Math.min(100, a.hunger + 5);
      a.energy = Math.max(0, a.energy - 4);
      var cause = '';
      if (a.hunger >= 100) { a.health -= 6; cause = 'starvation'; }
      if (a.energy <= 0) { a.health -= 4; cause = cause || 'exhaustion'; }

      if (a.plan.length) {
        var st = a.plan[a.pi];
        var res = applyAction(s, a, st);
        if (!res.ok) {
          out(s, 'fail', a.name, '✖ "' + desc(st) + '" failed: ' + res.text + ' — step skipped');
          rememberFail(a, st.action, res.text);
          a.pi++;
          a.status = 'skipped ✖';
          if (a.pi >= a.plan.length) { a.plan = []; a.pi = 0; a.status = 'idle'; a.needsDecision = true; }
        } else {
          st._left = (st._left || dur(st)) - 1;
          // long jobs (till/create): work doesn't stop for hunger — the worker eats mid-work from their own pack
          if ((st.action === 'till' || st.action === 'create') && a.hunger > 70 && a.inv.food > 0) {
            a.inv.food--; a.hunger = Math.max(0, a.hunger - 50);
            out(s, 'event', a.name, '🍽 ' + a.name + ' ate mid-work (' + desc(st) + ')');
          }
          a.status = desc(st) + ' · ' + res.text;
          if (st._left <= 0) {
            a.pi++;
            if (a.pi >= a.plan.length) {
              a.plan = []; a.pi = 0; a.status = 'idle'; a.needsDecision = true;
            }
          }
        }
        // till/create are long projects: hunger alone doesn't abort them (they'd be impossible) —
        // but hunger past 100 drains health for real. eat BEFORE starting a big job.
        if (a.plan.length && (a.health < 30 || (a.hunger > 85 && st.action !== 'till' && st.action !== 'create'))) {
          out(s, 'fail', a.name, '⚡ interrupted plan (health ' + Math.round(a.health) + '/hunger ' + Math.round(a.hunger) + ')');
          a.plan = []; a.pi = 0; a.status = 'idle'; a.needsDecision = true;
        }
      } else {
        a.status = 'idle';
      }

      if (a.health <= 0) {
        a.alive = false; a.health = 0; a.plan = [];
        out(s, 'death', a.name, '☠ ' + a.name + ' died at Day ' + dayOf(s.h) + ' ' + clockOf(s.h) + ' (' + (cause || 'wounds') + ')');
        for (var j = 0; j < s.agents.length; j++) {
          var o = s.agents[j];
          if (o.alive && o.loc === a.loc) { remember(s, o, a.name + ' DIED here.'); o.needsDecision = true; }
        }
      }
    }
  }

  function setPlan(s, a, plan, thought, goal) {
    var filtered = (plan || []).slice(0, 6).filter(function (st) { return st && typeof st.action === 'string'; });
    if (!filtered.length) {
      // rejected LLM plan (no valid steps): never go catatonic — fall back to the local brain
      out(s, 'fail', a.name, '✖ LLM plan had no valid steps → local brain fallback');
      filtered = localBrain(s, a);
    }
    a.plan = filtered;
    a.pi = 0; a.needsDecision = false; a.lastCallH = s.h;
    if (typeof thought === 'string') a.thought = thought.slice(0, 240);
    if (typeof goal === 'string') a.goal = goal.slice(0, 120);
    a.status = desc(a.plan[0]);
  }

  // Deterministic local brain: used by the live page (no LLM) and as runner fallback.
  function localBrain(s, a) {
    if (a.health < 60 && a.inv.water > 0) return [{ action: 'drink' }];
    if (a.hunger > 55 && a.inv.food > 0) return [{ action: 'eat' }];
    if (a.hunger > 50 && a.inv.food === 0)
      return a.loc === 'farm'
        ? [{ action: 'gather_food', hours: 2 }, { action: 'go', place: 'camp' }, { action: 'eat' }]
        : [{ action: 'go', place: 'farm' }, { action: 'gather_food', hours: 2 }, { action: 'go', place: 'camp' }, { action: 'eat' }];
    if (a.energy < 35)
      return a.loc === 'camp'
        ? [{ action: 'rest', hours: 3 }]
        : [{ action: 'go', place: 'camp' }, { action: 'rest', hours: 3 }];
    if (a.inv.food < 2)
      return a.loc === 'farm' ? [{ action: 'gather_food', hours: 2 }] : [{ action: 'go', place: 'farm' }, { action: 'gather_food', hours: 2 }];
    if (a.inv.wood < 1)
      return a.loc === 'forest' ? [{ action: 'gather_wood', hours: 2 }] : [{ action: 'go', place: 'forest' }, { action: 'gather_wood', hours: 2 }];
    return a.loc === 'well' ? [{ action: 'gather_water', hours: 2 }] : [{ action: 'go', place: 'well' }, { action: 'gather_water', hours: 2 }];
  }

  function dayOf(h) { return Math.floor(h / 24) + 1; }
  function clockOf(h) {
    var hh = h % 24;
    return (hh < 10 ? '0' : '') + hh + ':00';
  }

  var api = {
    createState: createState, tick: tick, applyAction: applyAction, setPlan: setPlan,
    localBrain: localBrain, desc: desc, ACTIONS: ACTIONS, LOCS: LOCS,
    NAMES: NAMES, dayOf: dayOf, clockOf: clockOf, out: out, remember: remember, byName: byName
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else self.SIM = api;
})();
</script>

<script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://unpkg.com/three@0.147.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
// ---------- 3D scene ----------
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fc4e8);
scene.fog = new THREE.Fog(0x8fc4e8, 45, 130);
var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
var camD = 10.5;
var camera = new THREE.OrthographicCamera(-camD * (innerWidth / innerHeight), camD * (innerWidth / innerHeight), camD, -camD, 0.1, 400);
camera.position.set(18, 20, 18);
camera.lookAt(0, 0, 0);
// fit della mappa intera: proietta i 4 angoli con camD=1 → servono max|nx|, max|ny|
function calcCamD() {
  var a = innerWidth / innerHeight;
  camera.left = -a; camera.right = a; camera.top = 1; camera.bottom = -1;
  camera.updateProjectionMatrix(); camera.updateMatrixWorld(true);
  var need = 0;
  [[-HALF, 0, -HALF], [HALF, 0, HALF], [HALF, 0, -HALF], [-HALF, 0, HALF]].forEach(function (c) {
    var v = new THREE.Vector3(c[0], c[1], c[2]).project(camera);
    need = Math.max(need, Math.abs(v.x), Math.abs(v.y));
  });
  return Math.max(6, need * 1.06);
}
var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.maxPolarAngle = 1.45;
controls.minZoom = 0.5; controls.maxZoom = 4;
var hemi = new THREE.HemisphereLight(0xdfe8ff, 0x35502a, 0.45);
var H_DAY = new THREE.Color(0xdfe8ff), H_NIGHT = new THREE.Color(0x39507e);
var G_DAY = new THREE.Color(0x35502a), G_NIGHT = new THREE.Color(0x131c22);
scene.add(hemi);
var sun = new THREE.DirectionalLight(0xfff2dd, 1.2);
sun.position.set(14, 20, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -15; sun.shadow.camera.right = 15;
sun.shadow.camera.top = 15; sun.shadow.camera.bottom = -15;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 70;
sun.shadow.bias = -0.0006; sun.shadow.radius = 3;
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);
var fireLight = new THREE.PointLight(0xff7722, 0, 7, 1.2);  // raggio 7 con dissolvenza morbida, non inonda la mappa
fireLight.position.set(8 - 8, 1.1, 8 - 8);
scene.add(fireLight);
function W(gx) { return gx - 8; }

// diorama slab: erba sopra, terra sotto
var MAT_SOIL = new THREE.MeshLambertMaterial({ color: 0x6b4a2a });
var MAT_TOP = new THREE.MeshLambertMaterial({ color: 0x3f8f45 });
var HALF = 16;  // mappa doppia (32x32), anello esterno volutamente vuoto
var ground = new THREE.Mesh(new THREE.BoxGeometry(HALF * 2, 1.2, HALF * 2),
  [MAT_SOIL, MAT_SOIL, MAT_TOP, MAT_SOIL, MAT_SOIL, MAT_SOIL]);
ground.position.y = -0.6;
ground.receiveShadow = true;
scene.add(ground);

// seeded rng (stessa scena a ogni reload)

// laghetto naturale al posto della fontana: specchio d'acqua organico + sponda + vegetazione
function buildLake(gx, gz) {
  var g = new THREE.Group();
  var MAT_WATER = new THREE.MeshPhongMaterial({ color: 0x3f9fe0, shininess: 70, specular: 0x88c4ee });
  var MAT_SHORE = new THREE.MeshLambertMaterial({ color: 0x7d6244 });
  // blob di terra (sponda) e d'acqua sovrapposti a offset diversi → forma organica, niente z-fight
  var blobs = [[0, 0, 2.0, 1.5], [1.5, 0.6, 1.3, 1.0], [-1.4, -0.5, 1.2, 0.9], [0.4, -1.3, 1.1, 0.8]];
  blobs.forEach(function (b, i) {
    var shore = new THREE.Mesh(new THREE.CircleGeometry(1, 9), MAT_SHORE);
    shore.rotation.x = -Math.PI / 2;
    shore.position.set(b[0], 0.012 + i * 0.001, b[1]);
    shore.scale.set(b[2] * 1.22, b[3] * 1.22, 1);
    shore.receiveShadow = true;
    g.add(shore);
    var w = new THREE.Mesh(new THREE.CircleGeometry(1, 9), MAT_WATER);
    w.rotation.x = -Math.PI / 2;
    w.position.set(b[0], 0.03 + i * 0.012, b[1]);
    w.scale.set(b[2], b[3], 1);
    g.add(w);
  });
  // vegetazione da riva: canne/erbette + fiori + un sasso
  [[2.6, 1.0], [-2.4, -0.9], [0.6, -2.2], [-1.7, 1.8], [2.2, -1.5]].forEach(function (p) {
    var reed = MODELS['grass_large'] && MODELS['grass_large'].clone(true);
    if (reed) { reed.position.set(p[0], reed.position.y, p[1]); reed.scale.setScalar(1.4); g.add(reed); }
  });
  [[-2.7, 1.3, 'flower_yellowA'], [2.9, -0.6, 'flower_purpleA'], [1.8, 2.1, 'flower_redA'], [-0.9, -2.4, 'flower_yellowA']].forEach(function (p) {
    var f = MODELS[p[2]] && MODELS[p[2]].clone(true);
    if (f) { f.position.set(p[0], f.position.y, p[1]); g.add(f); }
  });
  var rock = MODELS['rock_smallA'] && MODELS['rock_smallA'].clone(true);
  if (rock) { rock.position.set(-2.9, rock.position.y, -0.4); rock.scale.setScalar(1.3); g.add(rock); }
  g.traverse(function (c) { if (c.isMesh && c.geometry.type !== 'CircleGeometry') c.castShadow = true; });
  g.position.set(W(gx), 0, W(gz));
  scene.add(g);

}
function buildVillage() {
  // camp: accampamento con tende e falò (esiste da sempre)
  inst('tent_detailedOpen', 6.7, 8.9, 0.7);
  inst('tent_smallClosed', 9.3, 7.1, -0.9);
  inst('campfire_stones', 8, 8, 0.4);
  inst('lantern', 9.7, 9.5, 0);
  inst('cart', 7.6, 6.3, -0.5);
  // fattoria: mulino + recinto (la fattoria esiste sempre; le TESSERE compaiono con till/create)
  inst('windmill', 5.9, 0.7, 0.5);
  inst('sign', 5.5, 5.4, -0.6);
  var H = 1.5707963; // pezzo lungo Z: righe lungo X girano di 90°
  [[1.5,5.3,H],[2.5,5.3,H],[3.5,5.3,H],[4.5,5.3,H],[5.3,4.5,0],[5.3,3.5,0],[5.3,2.5,0],[5.3,1.5,0],[4.5,0.7,H],[3.5,0.7,H],[2.5,0.7,H],[1.5,0.7,H],[0.7,1.5,0],[0.7,2.5,0],[0.7,3.5,0],[0.7,4.5,0]].forEach(function (f) { inst('fence', f[0], f[1], f[2]); });
  inst('fence-gate', 1.5, 0.7, 1.5707963);
  // pozzo → fontana (l'acqua esiste sempre)
  buildLake(4, 12);
  // foresta: alberi veri fuori dalla ringhiera delle tessere (raggio >= 3)
  [['tree_oak',9.2,2.2],['tree_pineTallA',14.7,1.6],['tree_detailed',15.0,6.6],['tree_default',12.2,7.6],
   ['tree_fat',9.4,6.4],['tree_pineRoundA',15.1,4.2],['tree_blocks',8.6,7.4],['tree_simple',13.9,0.9]]
   .forEach(function (t) { inst(t[0], t[1], t[2], rnd() * 6.3); });
  inst('log_stack', 8.8, 6.2, 0.5);
  inst('stump_round', 15.1, 7.4, 0);
  // sentieri verso i luoghi
  inst('ground_pathTile', 4.9, 4.9, 0);
  inst('ground_pathTile', 4.9, 11.0, 0);
  inst('ground_pathTile', 10.3, 5.6, 0);
  // vegetazione sparsa (seeded, lontano dai nodi)
  var avoid = [[3,3],[4,12],[12,4],[8,8]];
  var deco = ['rock_smallA','rock_smallD','plant_bush','plant_bushLarge','grass_large','flower_redA','flower_yellowA','flower_purpleA','mushroom_tanGroup','rock_largeA','rock_tallA'];
  var placed = 0, tries = 0;
  while (placed < 42 && tries < 400) {
    tries++;
    var x = 1 + rnd() * 14, z = 1 + rnd() * 14, ok = true;
    for (var a = 0; a < avoid.length; a++) { var dx = x - avoid[a][0], dz = z - avoid[a][1]; if (dx * dx + dz * dz < 7) { ok = false; break; } }
    if (!ok) continue;
    inst(deco[Math.floor(rnd() * deco.length)], x, z, rnd() * 6.28, 0.8 + rnd() * 0.5);
    placed++;
  }
}

var COLORS = [0xd4a017, 0x5ac8fa, 0xff6b6b, 0xb48ade];

var meshes = [];             // { g, mixer, cur, curAction, px, pz } — compilato async
var CHAR_ANIMS = {};
var FACING_FIX = Math.PI;    // se il modello guarda al contrario, togli/reimposta
function buildVillagers(gltf) {
  var proto = gltf ? gltf.scene : null;
  if (proto && gltf.animations.length) {
    gltf.animations.forEach(function (c) { CHAR_ANIMS[c.name] = c; });
    // normalizza: altezza 1.45, piedi a y=0
    var bb = new THREE.Box3().setFromObject(proto);
    var hh = (bb.max.y - bb.min.y) || 1.6;
    var sc = 1.25 / hh;
    proto.scale.setScalar(sc);
    proto.position.y = -bb.min.y * sc;
    proto.rotation.y = FACING_FIX;
  }
  SIM_NAMES().forEach(function (nm, i) {
    var wrap = new THREE.Group(), mixer = null;
    var SK = window.SkeletonUtils || (window.THREE && THREE.SkeletonUtils);
    if (proto && SK) {
      var inner = SK.clone(proto);
      inner.traverse(function (c) {
        if (!c.isMesh) return;
        c.castShadow = true;
        var fix = function (m) {
          m = m.clone();
          if (m.color) m.color.setHex(COLORS[i]);
          if ('metalness' in m) { m.metalness = 0; m.roughness = 0.85; }
          return m;
        };
        c.material = Array.isArray(c.material) ? c.material.map(fix) : fix(c.material);
      });
      wrap.add(inner);
      mixer = new THREE.AnimationMixer(inner);
    } else {
      // fallback: scatola (se l'asset non carica)
      var body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.8, 0.5), new THREE.MeshLambertMaterial({ color: COLORS[i] }));
      body.position.y = 0.4; wrap.add(body);
      var head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 12, 10), new THREE.MeshLambertMaterial({ color: 0xf0d0a0 }));
      head.position.y = 1.05; wrap.add(head);

    scene.add(wrap);
    meshes.push({ g: wrap, mixer: mixer, cur: null, curAction: null, px: 0, pz: 0 });
  });
}
function clipFor(a) {
  var s = a.status || 'idle';
  if (a.alive === false) return null;
  if (/^go/.test(s)) return 'Walk_Carry_Loop';
  if (/^gather_food/.test(s)) return 'Farm_Harvest';
  if (/^gather_wood/.test(s)) return 'TreeChopping_Loop';
  if (/^gather_water/.test(s)) return 'Farm_Watering';
  if (/^(till|create)/.test(s)) return 'Farm_PlantSeed';
  if (/^(eat|drink)/.test(s)) return 'Consume';
  if (/^rest/.test(s)) return 'Idle_FoldArms_Loop';
  if (/^give/.test(s)) return 'OverhandThrow';
  if (/^take/.test(s)) return 'Chest_Open';
  if (/^say/.test(s)) return 'Idle_TalkingPhone_Loop';
  return 'Idle_No_Loop';
}
function playAnim(m, name) {
  if (!m.mixer) return;
  if (m.cur === name) return;
  var clip = name ? CHAR_ANIMS[name] : null;
  if (!clip && name) return;              // clip assente: resta su quella corrente
  if (m.curAction) m.curAction.fadeOut(0.25);
  m.cur = name;
  if (clip) { m.curAction = m.mixer.clipAction(clip); m.curAction.reset().fadeIn(0.25).play(); }
  else m.curAction = null;
}

var SKY_DAY = new THREE.Color(0x8fc4e8), SKY_NIGHT = new THREE.Color(0x0b1026), SKY_DUSK = new THREE.Color(0xe89a6a);
var tmpC = new THREE.Color();
function dayNight() {
  var h = frameH() % 24;
  var t = Math.max(0, Math.min(1, (h - 6) / 12));
  var ang = Math.PI * t;
  var day = Math.sin(ang);
  sun.position.set(Math.cos(ang) * 16, 2 + day * 18, 7);
  sun.intensity = 0.07 + day * 1.25;
  hemi.intensity = 0.3 + day * 0.3;
  hemi.color.copy(H_NIGHT).lerp(H_DAY, day);
  hemi.groundColor.copy(G_NIGHT).lerp(G_DAY, day);
  sun.color.setHSL(0.09 + 0.03 * day, 0.6 - 0.5 * day, 0.55 + 0.4 * day);
  tmpC.copy(SKY_NIGHT).lerp(SKY_DAY, day);
  if (day > 0 && day < 0.4) tmpC.lerp(SKY_DUSK, (0.4 - day) * 1.4);
  scene.background.copy(tmpC);
  scene.fog.color.copy(tmpC);
  fireLight.intensity = (1 - day) * (3.8 + Math.random() * 0.7);
}

// ---------- animation loop (fixed timestep: virtual time from real elapsed ms) ----------
var last = performance.now(), acc = 0;
function loop(now) {
  var dt = now - last; last = now;
  if (playing) {
    if (mode === 'replay') {
      acc += dt;
      var step = MS_PER_FRAME / speed;
      while (acc >= step && replayIdx < frames.length - 1) { acc -= step; replayIdx++; }
      if (replayIdx >= frames.length - 1) {
        if (streaming) { acc = 0; }  // live: aspetta il prossimo frame, resta in play
        else {
          playing = false;
          var b = document.getElementById('bPlay');
          b.textContent = '▶'; b.classList.remove('on');
        }
      }
      renderLog(); renderCards();
    } else {
      acc += dt;
      var vh = MS_PER_VH / speed;
      while (acc >= vh) { acc -= vh; SIM.tick(S); }
      renderLog(); renderCards();
    }
  }
  updateClock();
  dayNight();
  // smooth position interpolation toward each villager's location
  var ags = frameAgents();
  if (ags && meshes.length >= ags.length) {
    var perLoc = {};
    for (var q = 0; q < ags.length; q++) { // stack co-located villagers so nobody hides
      perLoc[ags[q].loc] = (perLoc[ags[q].loc] || 0);
      ags[q]._stack = perLoc[ags[q].loc]++;
    }
    for (var i = ags.length; i < meshes.length; i++) meshes[i].g.visible = false;  // replay vecchi a 3
    for (var i = 0; i < ags.length; i++) {
      var L = SIM.LOCS[ags[i].loc] || [8, 8];
      var st = ags[i]._stack;
      var tx = W(L[0]) + (st % 2 ? 0.9 : -0.9) * Math.min(st, 2) * 0.8;
      var tz = W(L[1]) + (st > 1 ? 1.3 : 0);
      var m = meshes[i];
      var nx = m.px + (tx - m.px) * Math.min(1, dt / 400);
      var nz = m.pz + (tz - m.pz) * Math.min(1, dt / 400);
      m.g.position.set(nx, 0, nz);
      m.g.visible = ags[i].alive !== false;
      var dx = tx - nx, dz = tz - nz;
      if (Math.abs(dx) > 0.01 || Math.abs(dz) > 0.01) m.g.rotation.y = Math.atan2(dx, dz);
      m.px = nx; m.pz = nz;
      // anim: cammina se si muove, altrimenti lo stato del piano
      var moving = Math.abs(dx) > 0.015 || Math.abs(dz) > 0.015;
      playAnim(m, moving ? 'Walk_Carry_Loop' : clipFor(ags[i]));
      if (m.mixer) m.mixer.update(dt / 1000);
    }
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

addEventListener('resize', function () {
  renderer.setSize(innerWidth, innerHeight);
  camD = calcCamD();
  camera.left = -camD * (innerWidth / innerHeight);
  camera.right = camD * (innerWidth / innerHeight);
  camera.top = camD; camera.bottom = -camD;
  camera.updateProjectionMatrix();
});
camD = calcCamD();  // fit iniziale
camera.left = -camD * (innerWidth / innerHeight);
camera.right = camD * (innerWidth / innerHeight);
camera.top = camD; camera.bottom = -camD;
camera.updateProjectionMatrix();
</script>
</body>
